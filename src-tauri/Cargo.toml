[package]
name = "private-file-manager"
version = "0.1.0"
description = "Private File Manager"
authors = ["you"]
edition = "2021"
default-run = "private-file-manager"

[lib]
name = "private_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pfm-repair"
path = "src/repair.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
image = "0.25"
mime_guess = "2"
tempfile = "3"
ffmpeg-sidecar = "2"
sha2 = "0.10"
dirs = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
